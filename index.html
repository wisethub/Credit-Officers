<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receipt Analytics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family: Inter, system-ui, sans-serif;
    background:#0d1117;
    color:#e6edf3;
    min-height:100vh;
    padding:20px;
  }

  .ctrl-bar {
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:12px 16px;
    margin-bottom:18px;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    position:sticky;
    top:0;
    z-index:20;
  }

  .load-btn {
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    background:#238636;
    color:#fff;
    transition:.2s;
  }

  .load-btn:hover { opacity:.9; }

  .load-btn:disabled {
    opacity:.45;
    cursor:not-allowed;
  }

  .prog-wrap {
    flex:1;
    min-width:120px;
    height:6px;
    background:#30363d;
    border-radius:999px;
    overflow:hidden;
  }

  .prog-bar {
    height:100%;
    width:0%;
    background:#58a6ff;
    border-radius:999px;
    transition:width .25s;
  }

  .status-txt {
    font-size:12px;
    color:#8b949e;
    white-space:nowrap;
  }

  .err-box {
    color:#f85149;
    background:#161b22;
    border:1px solid #30363d;
    border-radius:8px;
    padding:14px 16px;
    font-size:13px;
    margin-bottom:16px;
  }

  .filter-wrap {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
    margin-bottom:18px;
  }

  .filter-box {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:14px;
  }

  .filter-box label {
    display:block;
    margin-bottom:8px;
    color:#8b949e;
    font-size:12px;
    font-weight:600;
  }

  .filter-box input,
  .filter-box select {
    width:100%;
    background:#0d1117;
    color:#e6edf3;
    border:1px solid #30363d;
    border-radius:8px;
    padding:10px;
    outline:none;
  }

  .cards {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:22px;
  }

  .card {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:16px;
    padding:18px;
    box-shadow:0 0 0 1px rgba(255,255,255,.02);
  }

  .card-title {
    color:#8b949e;
    font-size:12px;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  .card-value {
    font-size:28px;
    font-weight:800;
    line-height:1.1;
  }

  .card-sub {
    margin-top:8px;
    color:#8b949e;
    font-size:12px;
  }

  .grid {
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap:18px;
    margin-bottom:18px;
  }

  .panel {
    background:#161b22;
    border:1px solid #30363d;
    border-radius:16px;
    padding:18px;
  }

  .panel h3 {
    margin-bottom:16px;
    font-size:16px;
  }

  .table-wrap {
    overflow:auto;
    border-radius:12px;
    border:1px solid #30363d;
  }

  table {
    width:100%;
    border-collapse:collapse;
    min-width:800px;
  }

  thead {
    background:#0d1117;
    position:sticky;
    top:0;
  }

  th, td {
    padding:12px 14px;
    border-bottom:1px solid #30363d;
    text-align:left;
    font-size:13px;
  }

  th {
    color:#8b949e;
    font-weight:700;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.5px;
  }

  tbody tr:hover {
    background:#1f2937;
  }

  .badge {
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#0d1117;
    border:1px solid #30363d;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
  }

  .empty-state {
    padding:40px;
    text-align:center;
    color:#8b949e;
    background:#161b22;
    border:1px dashed #30363d;
    border-radius:16px;
  }

  canvas {
    width:100% !important;
    max-height:360px !important;
  }

  @media(max-width:980px){
    .grid{
      grid-template-columns:1fr;
    }
  }
</style>

</head>

<body>

<div class="ctrl-bar">
  <button class="load-btn" id="load-btn" onclick="loadAllRecords()">⬇ Load Dashboard</button>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  <span class="status-txt" id="status-txt">Press Load to fetch data from Manager.io</span>
</div>

<div id="app"></div>

<script>
/* ══════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('Timeout — is this running inside Manager.io?'));
    }, 15000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        resolve(event.data.body);
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════
   getCustomerBatch
══════════════════════════════════ */
async function getCustomerBatch(onProgress) {
  const allItems = [];
  let nextToken  = null;
  let pageNum    = 0;
  let apiTotal   = null;

  do {
    const path = nextToken
      ? '/api4/customer-batch?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : '/api4/customer-batch?PageSize=99999';

    const data = await postMessageWithResponse({ type: 'api-request', method: 'GET', path });

    const page = Array.isArray(data) ? data : (data.items || data.data || []);
    allItems.push(...page);

    nextToken = data.next_page_token || data.nextPageToken || data._links?.next?.href || null;

    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);
    if (pageNum >= 1000) break;

  } while (nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Generic pagination fetcher
══════════════════════════════════ */
async function getReceiptBatch(onProgress) {
  const allItems = [];
  let nextToken  = null;
  let pageNum    = 0;
  let apiTotal   = null;

  do {
    const path = nextToken
      ? '/api4/receipt-batch?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : '/api4/receipt-batch?PageSize=99999';

    const data = await postMessageWithResponse({ type:'api-request', method:'GET', path });

    const page = Array.isArray(data) ? data : (data.items || data.data || []);
    allItems.push(...page);

    nextToken = data.next_page_token || data.nextPageToken || data._links?.next?.href || null;

    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);
    if (pageNum >= 1000) break;

  } while(nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Utilities
══════════════════════════════════ */
const fmtMoney = v =>
  '₦' + Number(v || 0).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const fmtDate = d => {
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return '-';
  return dt.toLocaleDateString(undefined,{
    year:'numeric',
    month:'short',
    day:'numeric'
  });
};

function safe(v,fallback='-'){
  return v ?? fallback;
}

/* ══════════════════════════════════
   Main Loader
══════════════════════════════════ */
async function loadAllRecords() {

  const btn    = document.getElementById('load-btn');
  const bar    = document.getElementById('prog-bar');
  const status = document.getElementById('status-txt');
  const app    = document.getElementById('app');

  btn.disabled = true;
  btn.textContent = 'Loading…';
  app.innerHTML = '';
  bar.style.width = '0%';

  try {

    status.textContent = 'Loading customers...';

    const customers = await getCustomerBatch((loaded,total,page)=>{
      status.textContent = `Customers: ${loaded.toLocaleString()} loaded`;
      if(total){
        bar.style.width = Math.min(45, loaded/total*45) + '%';
      }
    });

    status.textContent = 'Loading receipts...';

    const receipts = await getReceiptBatch((loaded,total,page)=>{
      status.textContent = `Receipts: ${loaded.toLocaleString()} loaded`;
      if(total){
        bar.style.width = 45 + Math.min(50, loaded/total*50) + '%';
      }
    });

    bar.style.width = '100%';

    status.textContent =
      `✓ ${customers.length.toLocaleString()} customers · ${receipts.length.toLocaleString()} receipts loaded`;

    btn.disabled = false;
    btn.textContent = '↺ Reload Dashboard';

    render({
      customers,
      receipts
    });

  } catch(err){

    btn.disabled = false;
    btn.textContent = '↺ Retry';

    status.textContent = '⚠ ' + err.message;

    app.innerHTML = `
      <div class="err-box">
        <strong>Unable to load data</strong><br><br>
        ${err.message}<br><br>
        <small>Ensure this extension is running inside Manager.io.</small>
      </div>
    `;
  }
}

/* ══════════════════════════════════
   Dashboard Renderer
══════════════════════════════════ */
function render(data) {

  const app = document.getElementById('app');

  const customers = data?.customers || [];
  const receipts  = data?.receipts || [];

  if(!receipts.length){

    app.innerHTML = `
      <div class="empty-state">
        <h2 style="margin-bottom:10px">No Receipt Records Found</h2>
        <p>No data available from /api4/receipt-batch</p>
      </div>
    `;
    return;
  }

  /* Build customer map */
  const customerMap = {};
  customers.forEach(c=>{
    customerMap[c?.key] = c?.item?.name || 'Unknown Customer';
  });

  /* Normalize receipt lines */
  const rows = [];

  receipts.forEach(r=>{

    const receiptDate = r?.item?.date;
    const reference   = r?.item?.reference;
    const customerId  = r?.item?.customer;
    const customer    = customerMap[customerId] || 'Unknown Customer';

    const lines = r?.item?.lines || [];

    lines.forEach(line=>{

      const officer =
        line?.customFields2?.strings?.['50ca827c-17af-4164-bc29-453df6192f02']
        || 'Unassigned';

      rows.push({
        date: receiptDate,
        reference,
        customer,
        officer,
        amount: Number(line?.amount || 0)
      });
    });

  });

  /* Summary */
  const totalReceipts = rows.length;

  const totalValue = rows.reduce((a,b)=>a+b.amount,0);

  const uniqueCustomers =
    new Set(rows.map(r=>r.customer)).size;

  const uniqueOfficers =
    new Set(rows.map(r=>r.officer)).size;

  /* Officer grouping */
  const officerSummary = {};

  rows.forEach(r=>{

    if(!officerSummary[r.officer]){
      officerSummary[r.officer] = {
        officer:r.officer,
        total:0,
        count:0
      };
    }

    officerSummary[r.officer].total += r.amount;
    officerSummary[r.officer].count += 1;
  });

  const officerArray =
    Object.values(officerSummary)
    .sort((a,b)=>b.total-a.total);

  /* Filters */
  app.innerHTML = `
    <div class="filter-wrap">

      <div class="filter-box">
        <label>Search Customer</label>
        <input id="searchInput" placeholder="Type customer name...">
      </div>

      <div class="filter-box">
        <label>Credit Officer</label>
        <select id="officerFilter">
          <option value="">All Officers</option>
          ${[...new Set(rows.map(r=>r.officer))]
            .sort()
            .map(o=>`<option>${o}</option>`)
            .join('')}
        </select>
      </div>

      <div class="filter-box">
        <label>From Date</label>
        <input type="date" id="fromDate">
      </div>

      <div class="filter-box">
        <label>To Date</label>
        <input type="date" id="toDate">
      </div>

    </div>

    <div class="cards">

      <div class="card">
        <div class="card-title">Total Receipt Lines</div>
        <div class="card-value">${totalReceipts.toLocaleString()}</div>
        <div class="card-sub">All receipt line records</div>
      </div>

      <div class="card">
        <div class="card-title">Total Receipt Value</div>
        <div class="card-value">${fmtMoney(totalValue)}</div>
        <div class="card-sub">Combined receipt amount</div>
      </div>

      <div class="card">
        <div class="card-title">Customers</div>
        <div class="card-value">${uniqueCustomers.toLocaleString()}</div>
        <div class="card-sub">Unique customers</div>
      </div>

      <div class="card">
        <div class="card-title">Credit Officers</div>
        <div class="card-value">${uniqueOfficers.toLocaleString()}</div>
        <div class="card-sub">Active officers</div>
      </div>

    </div>

    <div class="grid">

      <div class="panel">
        <h3>Receipt Collection by Credit Officer</h3>
        <canvas id="officerChart"></canvas>
      </div>

      <div class="panel">
        <h3>Top Credit Officers</h3>

        <div style="display:flex;flex-direction:column;gap:10px">
          ${officerArray.slice(0,8).map(o=>`
            <div class="badge" style="justify-content:space-between;width:100%">
              <span>${o.officer}</span>
              <strong>${fmtMoney(o.total)}</strong>
            </div>
          `).join('')}
        </div>

      </div>

    </div>

    <div class="panel">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">
        <h3>Receipt Analysis Table</h3>
        <div class="badge">
          <span id="recordCount">${rows.length.toLocaleString()}</span> Records
        </div>
      </div>

      <div class="table-wrap">

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Reference</th>
              <th>Customer</th>
              <th>Credit Officer</th>
              <th>Amount</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>

      </div>

    </div>
  `;

  const tbody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const officerFilter = document.getElementById('officerFilter');
  const fromDate = document.getElementById('fromDate');
  const toDate = document.getElementById('toDate');
  const recordCount = document.getElementById('recordCount');

  function renderTable(filtered){

    tbody.innerHTML = '';

    if(!filtered.length){

      tbody.innerHTML = `
        <tr>
          <td colspan="5" style="text-align:center;padding:30px;color:#8b949e">
            No matching records found
          </td>
        </tr>
      `;

      recordCount.textContent = '0';
      return;
    }

    filtered.forEach(r=>{

      tbody.innerHTML += `
        <tr>
          <td>${fmtDate(r.date)}</td>
          <td>${safe(r.reference)}</td>
          <td>${safe(r.customer)}</td>
          <td>${safe(r.officer)}</td>
          <td><strong>${fmtMoney(r.amount)}</strong></td>
        </tr>
      `;
    });

    recordCount.textContent =
      filtered.length.toLocaleString();
  }

  function applyFilters(){

    const q = searchInput.value.toLowerCase().trim();
    const officer = officerFilter.value;
    const from = fromDate.value;
    const to = toDate.value;

    const filtered = rows.filter(r=>{

      const matchesSearch =
        !q ||
        r.customer.toLowerCase().includes(q);

      const matchesOfficer =
        !officer ||
        r.officer === officer;

      let matchesDate = true;

      if(from){
        matchesDate =
          matchesDate &&
          new Date(r.date) >= new Date(from);
      }

      if(to){
        const toD = new Date(to);
        toD.setHours(23,59,59,999);

        matchesDate =
          matchesDate &&
          new Date(r.date) <= toD;
      }

      return matchesSearch &&
             matchesOfficer &&
             matchesDate;

    });

    renderTable(filtered);
  }

  searchInput.addEventListener('input', applyFilters);
  officerFilter.addEventListener('change', applyFilters);
  fromDate.addEventListener('change', applyFilters);
  toDate.addEventListener('change', applyFilters);

  renderTable(rows);

  /* Chart */
  const ctx = document.getElementById('officerChart');

  new Chart(ctx,{
    type:'bar',
    data:{
      labels: officerArray.slice(0,10).map(o=>o.officer),
      datasets:[{
        label:'Receipt Value',
        data: officerArray.slice(0,10).map(o=>o.total),
        backgroundColor:'#58a6ff',
        borderRadius:6
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          labels:{
            color:'#e6edf3'
          }
        }
      },
      scales:{
        x:{
          ticks:{ color:'#8b949e' },
          grid:{ color:'#30363d' }
        },
        y:{
          ticks:{
            color:'#8b949e',
            callback:(v)=>'₦'+Number(v).toLocaleString()
          },
          grid:{ color:'#30363d' }
        }
      }
    }
  });

}
</script>

</body>
</html>
